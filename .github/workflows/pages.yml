name: Documentation
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned documentation dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Validate source, metadata and publication boundaries
        run: |
          python scripts/validate.py
      - name: Build documentation
        run: |
          python -m mkdocs build --strict
      - name: Validate generated pages and search
        run: |
          python scripts/validate.py --built
      - name: Upload Pages artifact
        if: ${{ github.repository == 'rcarigna/medieval-dynasty-modding' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_PUBLISH_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: ${{ github.repository == 'rcarigna/medieval-dynasty-modding' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_PUBLISH_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
